name: DeploySimpleWorkflow

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      RG_LA:
        description: Resource Group Name
        required: true
      LA_NAME:
        description: Logic App Standard Name
        required: true

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Deployment Folder
        run: |
          mkdir deploy

          cp host.json deploy/
          cp connections.json deploy/

          # Copy workflow folders
          cp -r Stateful1 deploy/

          # Copy additional folders if required
          # cp -r Artifacts deploy/
          # cp -r lib deploy/

      - name: Create Zip Package
        run: |
          cd deploy
          zip -r ../logicapp.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: logicapp.zip

  Deploy:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-art

