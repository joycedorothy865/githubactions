name: DeploySimpleWorkflow

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      RG_LA:
        description: Resource Group Name
        required: true
      LA_NAME:
        description: Logic App Standard Name
        required: true

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create package
        run: |
         zip -r ${{ github.run_id }}.zip . \
         -x ".git/*" \
         -x ".github/*" \
         -x "local.settings.json"


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ${{ github.run_id }}.zip

  Deploy:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Verify Azure Context
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            Get-AzContext

      - name: Verify Logic App
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            $app = Get-AzWebApp `
              -ResourceGroupName "${{ github.event.inputs.RG_LA }}" `
              -Name "${{ github.event.inputs.LA_NAME }}"

            Write-Host "Name: $($app.Name)"
            Write-Host "Kind: $($app.Kind)"
            Write-Host "State: $($app.State)"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-art

      - name: Deploy Logic App Standard
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ github.event.inputs.LA_NAME }}
          package: build-art/${{ github.run_id }}.zip
